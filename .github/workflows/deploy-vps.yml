name: Deploy (VPS)

on:
  push:
    branches: [master, main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      # Public values (embedded into the frontend build). Prefer GitHub Variables; Secrets also work.
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || vars.VITE_GOOGLE_CLIENT_ID }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN || vars.VITE_SENTRY_DSN }}
      # Chave PUBLICA da Pagar.me (pk_...). E ela que permite tokenizar o cartao no
      # navegador; sem ela o site esconde o cartao e oferece PIX, em vez de mandar o
      # cliente para o checkout hospedado, que nao repassa a parte do profissional.
      # NUNCA colocar aqui uma chave sk_: tudo neste bloco vai embutido no bundle.
      VITE_PAGARME_PUBLIC_KEY: ${{ secrets.VITE_PAGARME_PUBLIC_KEY || vars.VITE_PAGARME_PUBLIC_KEY }}
    steps:
      - name: Valida secrets do deploy
        id: deploy_guard
        run: |
          if [ -n "${VPS_HOST}" ] && [ -n "${VPS_USER}" ] && [ -n "${VPS_SSH_KEY}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Antes era um aviso que pulava o deploy e terminava "success": o site de producao
          # nunca foi publicado pelo CI e ninguem percebeu. Agora falha.
          echo "::error::Faltam secrets no repositorio: configure VPS_HOST, VPS_USER e VPS_SSH_KEY."
          exit 1

      - name: Checkout
        if: steps.deploy_guard.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.deploy_guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install
        if: steps.deploy_guard.outputs.enabled == 'true'
        run: npm ci

      # O build de producao precisa destas variaveis: sem elas o site sobe sem login com Google,
      # sem Sentry e com a chave publica da Pagar.me vazia, e o pagamento com cartao quebra
      # (foi o que aconteceu na republicacao manual de 21/09/2026). Faltando alguma, o deploy
      # para aqui em vez de publicar um site quebrado.
      - name: Confere as variaveis do build
        if: steps.deploy_guard.outputs.enabled == 'true'
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_PAGARME_PUBLIC_KEY: ${{ secrets.VITE_PAGARME_PUBLIC_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          faltam=""
          for nome in VITE_GOOGLE_CLIENT_ID VITE_PAGARME_PUBLIC_KEY VITE_SENTRY_DSN; do
            [ -n "${!nome}" ] || faltam="$faltam $nome"
          done
          if [ -n "$faltam" ]; then
            echo "::error::Faltam secrets do build no repositorio:$faltam"
            exit 1
          fi
          case "$VITE_PAGARME_PUBLIC_KEY" in
            pk_*) ;;
            *) echo "::error::VITE_PAGARME_PUBLIC_KEY nao parece uma chave publica da Pagar.me (pk_...)."; exit 1 ;;
          esac

      - name: Build
        if: steps.deploy_guard.outputs.enabled == 'true'
        env:
          VITE_API_BASE_URL: https://api.arqdoor.com
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_PAGARME_PUBLIC_KEY: ${{ secrets.VITE_PAGARME_PUBLIC_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build

      - name: Confere que a chave da Pagar.me entrou no build
        if: steps.deploy_guard.outputs.enabled == 'true'
        run: |
          if ! grep -rqE 'pk_[A-Za-z0-9]{6}' dist/assets; then
            echo "::error::O build saiu sem a chave publica da Pagar.me; o cartao nao funcionaria."
            exit 1
          fi
          echo "Chave publica da Pagar.me presente no build."

      - name: Package dist
        if: steps.deploy_guard.outputs.enabled == 'true'
        run: tar -czf dist.tar.gz -C dist .

      - name: Setup SSH Agent
        if: steps.deploy_guard.outputs.enabled == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS Host Key
        if: steps.deploy_guard.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          # Ate 5 tentativas: em 09/10/2026 uma oscilacao de 5s no keyscan derrubou um deploy de producao.
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" > /tmp/vps_keys 2>/dev/null && [ -s /tmp/vps_keys ]; then
              cat /tmp/vps_keys >> ~/.ssh/known_hosts
              exit 0
            fi
            echo "ssh-keyscan falhou (tentativa $i/5); nova tentativa em 10s"
            sleep 10
          done
          echo "::error::Nao foi possivel ler a chave da VPS por SSH."
          exit 1


      - name: Upload dist tarball
        if: steps.deploy_guard.outputs.enabled == 'true'
        run: scp -o BatchMode=yes dist.tar.gz "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/arqdoor-dist.tar.gz"

      - name: Extract on VPS
        if: steps.deploy_guard.outputs.enabled == 'true'
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOF'
          set -euo pipefail

          DEST='${{ secrets.VPS_FRONTEND_PATH }}'
          if [ -z "$DEST" ]; then
            DEST='/var/www/arqdoor'
          fi

          mkdir -p "$DEST"
          tar -xzf /tmp/arqdoor-dist.tar.gz -C "$DEST"
          chmod -R a+rX "$DEST"
          rm -f /tmp/arqdoor-dist.tar.gz

          if command -v nginx >/dev/null 2>&1; then
            nginx -t
            # Static deploy doesn't require reload, but it's cheap and safe if systemd is present.
            if command -v systemctl >/dev/null 2>&1; then
              systemctl reload nginx || true
            fi
          fi
          EOF
