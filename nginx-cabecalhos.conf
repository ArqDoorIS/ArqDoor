# Cabecalhos de seguranca de toda resposta (spec specs/features/2026-11-site-ganhos-rapidos).
#
# Incluido no `server` E em cada `location` que tem `add_header` proprio: o nginx so herda
# os `add_header` do bloco de fora quando o de dentro nao tem nenhum. Era por isso que as
# paginas do staging saiam sem cabecalho algum (o `location /` tem o seu Cache-Control).
#
# Valendo: o site nao abre dentro de iframe de outra origem (clickjacking em pagamento e
# assinatura). A CSP completa so RELATA, igual a de producao, para conferir os relatorios
# antes de ligar; a API certa sai do `$api_da_previa` (staging ou producao).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://$api_da_previa https://*.googleusercontent.com; connect-src 'self' https://$api_da_previa wss://$api_da_previa https://api.pagar.me https://viacep.com.br https://*.sentry.io https://accounts.google.com; frame-src 'self' blob: https://$api_da_previa https://accounts.google.com; frame-ancestors 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri https://$api_da_previa/csp-report" always;
