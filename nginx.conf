# Robos de previa (WhatsApp, Facebook, Telegram...) que abrem /convite/<token> recebem do
# backend um HTML curto com as meta tags Open Graph; pessoas recebem a SPA de sempre.
# Spec: specs/features/2026-10-convite-previa/03-contrato.md
map $http_user_agent $robo_de_previa {
    default 0;
    "~*(whatsapp|facebookexternalhit|facebot|telegrambot|twitterbot|slackbot|linkedinbot|discordbot|skypeuripreview|pinterest|redditbot|applebot)" 1;
}

# O mesmo arquivo serve staging e, depois da migracao para o Coolify, producao.
map $host $api_da_previa {
    default api.arqdoor.com;
    staging.arqdoor.com api.staging.arqdoor.com;
}

# Staging nao entra em busca: o robots.txt de la bloqueia tudo.
map $host $robots_bloqueia_tudo {
    default 0;
    staging.arqdoor.com 1;
}

server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
    
    # Cabecalhos de seguranca: ver nginx-cabecalhos.conf.
    include /etc/nginx/cabecalhos-de-seguranca.conf;

    # www vai para o endereco sem www. Vale quando a producao rodar nesta imagem
    # (spec 2026-10-site-producao-coolify); hoje o www de producao e o nginx do servidor.
    if ($host = www.arqdoor.com) {
        return 301 https://arqdoor.com$request_uri;
    }
    
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/cabecalhos-de-seguranca.conf;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Previa do link de proposta para robos. proxy_pass com variavel precisa de resolver:
    # 127.0.0.11 e o DNS do Docker; os publicos ficam de reserva.
    resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 3s;

    location ~ "^/convite/(?<token_do_convite>[A-Za-z0-9_-]{1,128})/?$" {
        # recursive: o erro do proxy (inclusive DNS) tambem cai na SPA.
        recursive_error_pages on;
        error_page 418 = @previa_do_convite;
        if ($robo_de_previa) {
            return 418;
        }
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/cabecalhos-de-seguranca.conf;
    }

    location @previa_do_convite {
        proxy_pass https://$api_da_previa/invites/public/$token_do_convite/previa;
        proxy_ssl_server_name on;
        proxy_ssl_name $api_da_previa;
        proxy_set_header Host $api_da_previa;
        proxy_set_header X-Site-Origin https://$host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        # Backend fora do ar: o robo recebe a SPA (previa generica), nunca erro.
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa_do_convite;
    }

    location @spa_do_convite {
        try_files /index.html =404;
    }

    location = /robots.txt {
        # `default_type` nao vale dentro do `if`: daqui ele tipa o texto do `return`.
        default_type text/plain;
        if ($robots_bloqueia_tudo) {
            return 200 "User-agent: *\nDisallow: /\n";
        }
        try_files $uri =404;
    }

    # SPA fallback - redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/cabecalhos-de-seguranca.conf;
    }
}
